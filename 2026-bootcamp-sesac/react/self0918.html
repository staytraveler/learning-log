<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>useEffect & State 연습문제 5선</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px 80px;
            color: #222;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: #f4f6fa;
        }

        h1 {
            margin-bottom: 8px;
        }

        h2 {
            margin-top: 0;
            font-size: 21px;
        }

        button,
        input {
            padding: 9px 12px;
            font-size: 15px;
            font-family: inherit;
        }

        button {
            border: 0;
            border-radius: 6px;
            color: white;
            background: #315efb;
            cursor: pointer;
        }

        button.secondary {
            background: #596275;
        }

        .description {
            margin-top: 0;
            color: #596275;
        }

        .app {
            display: grid;
            gap: 24px;
            margin-top: 30px;
        }

        .problem {
            padding: 24px;
            border: 1px solid #dfe4ea;
            border-radius: 12px;
            background: white;
        }

        .requirements {
            padding: 14px 18px 14px 36px;
            border-radius: 8px;
            line-height: 1.7;
            background: #f1f4ff;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0;
            align-items: center;
        }

        .result {
            min-height: 44px;
            margin-top: 14px;
            padding: 12px;
            border: 1px dashed #a4b0be;
            border-radius: 6px;
            background: #fafafa;
        }

        .log-box {
            margin-top: 14px;
            padding: 12px;
            border-radius: 6px;
            background: #2f3542;
            color: #7bed9f;
            font-family: monospace;
            font-size: 13px;
            max-height: 140px;
            overflow-y: auto;
        }

        .todo-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
        }
    </style>
</head>

<body>

    <h1>useEffect & State 연습문제 5선</h1>

    <p class="description">
        오늘 배운 useEffect(의존성 배열, cleanup, 마운트/언마운트)와 state 관리를 활용해 TODO를 완성하세요.
        콘솔(F12)을 열어두고 확인하는 문제가 많습니다.
    </p>

    <div id="root"></div>

    <script type="text/babel">

        const { useState, useEffect } = React;


        // ============================================================
        // 문제 1. 마운트 시 한 번만 인사하기
        // ============================================================

        function WelcomeMessage() {

            useEffect(() => {
                console.log('컴포넌트가 마운트되었습니다.');
            }, []);

            return (
                <section className="problem">
                    <h2>문제 1. 마운트 시 한 번만 인사하기</h2>

                    <ul className="requirements">
                        <li>
                            컴포넌트가 처음 화면에 나타날 때 콘솔에
                            <code>'컴포넌트가 마운트되었습니다'</code>를 한 번만 출력합니다.
                        </li>

                        <li>
                            이후 리렌더링이 일어나도 다시 출력되면 안 됩니다.
                        </li>
                    </ul>

                    <div className="result">
                        콘솔을 확인하세요 (F12)
                    </div>
                </section>
            );
        }


        // ============================================================
        // 문제 2. 클릭 횟수에 따라 탭 제목 바꾸기
        // ============================================================

        function TitleUpdater() {

            const [count, setCount] = useState(0);

            useEffect(() => {

                const $title = document.querySelector('title');

                $title.textContent = `클릭 ${count}회`;

            }, [count]);

            return (
                <section className="problem">

                    <h2>문제 2. 클릭 횟수에 따라 탭 제목 바꾸기</h2>

                    <ul className="requirements">
                        <li>
                            <code>count</code> state를 0으로 시작합니다.
                        </li>

                        <li>
                            버튼을 누르면 count가 1 증가합니다.
                        </li>

                        <li>
                            count가 바뀔 때마다 브라우저 탭 제목이
                            "클릭 3회"처럼 바뀝니다.
                        </li>

                        <li>
                            탭 제목은 count가 실제로 바뀔 때만 갱신되어야 합니다.
                        </li>
                    </ul>

                    <div className="controls">

                        <button
                            onClick={() => setCount(count + 1)}
                        >
                            클릭 (현재 {count}회)
                        </button>

                    </div>

                    <div className="result">
                        브라우저 탭 제목을 확인하세요
                    </div>

                </section>
            );
        }


        // ============================================================
        // 문제 3. 스톱워치
        // ============================================================

        function StopWatch() {

            const [seconds, setSeconds] = useState(0);
            const [isRunning, setIsRunning] = useState(false);

            useEffect(() => {

                // 실행 중이 아니라면 타이머를 만들지 않는다.
                if (!isRunning) {
                    return;
                }

                // 1초마다 seconds를 1 증가
                const timerId = setInterval(() => {

                    setSeconds(prevSeconds => prevSeconds + 1);

                }, 1000);

                // cleanup
                // isRunning이 false가 되거나
                // 컴포넌트가 언마운트될 때 실행
                return () => {

                    clearInterval(timerId);

                };

            }, [isRunning]);


            const handleReset = () => {

                setIsRunning(false);
                setSeconds(0);

            };


            return (
                <section className="problem">

                    <h2>문제 3. 스톱워치</h2>

                    <ul className="requirements">

                        <li>
                            <code>seconds</code>(경과 초),
                            <code>isRunning</code>(실행 여부) state를 관리합니다.
                        </li>

                        <li>
                            시작 버튼을 누르면 1초마다 seconds가 1씩 증가합니다.
                        </li>

                        <li>
                            정지 버튼을 누르면 더 이상 증가하지 않습니다.
                        </li>

                        <li>
                            초기화 버튼을 누르면 정지하고 seconds를 0으로 되돌립니다.
                        </li>

                    </ul>

                    <h3>{seconds}초</h3>

                    <div className="controls">

                        <button
                            onClick={() => setIsRunning(true)}
                        >
                            시작
                        </button>

                        <button
                            className="secondary"
                            onClick={() => setIsRunning(false)}
                        >
                            정지
                        </button>

                        <button
                            className="secondary"
                            onClick={handleReset}
                        >
                            초기화
                        </button>

                    </div>

                </section>
            );
        }


        // ============================================================
        // 문제 4. 온라인 / 오프라인 상태 감지
        // ============================================================

        function NetworkStatus() {

            // 현재 네트워크 상태로 초기화
            const [isOnline, setIsOnline] = useState(
                navigator.onLine
            );


            useEffect(() => {

                // 온라인이 되었을 때
                const handleOnline = () => {
                    setIsOnline(true);
                };

                // 오프라인이 되었을 때
                const handleOffline = () => {
                    setIsOnline(false);
                };


                // 이벤트 등록
                window.addEventListener(
                    'online',
                    handleOnline
                );

                window.addEventListener(
                    'offline',
                    handleOffline
                );


                // cleanup
                return () => {

                    window.removeEventListener(
                        'online',
                        handleOnline
                    );

                    window.removeEventListener(
                        'offline',
                        handleOffline
                    );

                };

            }, []);


            return (
                <section className="problem">

                    <h2>문제 4. 온라인/오프라인 상태 감지</h2>

                    <ul className="requirements">

                        <li>
                            <code>isOnline</code> state를 현재 네트워크 상태로 초기화합니다.
                        </li>

                        <li>
                            네트워크 연결이 끊기거나 복구되면 자동으로 state가 갱신됩니다.
                        </li>

                        <li>
                            컴포넌트가 사라질 때 등록한 이벤트 리스너를 정리합니다.
                        </li>

                    </ul>

                    <div className="result">

                        상태: {isOnline ? '온라인 🟢' : '오프라인 🔴'}

                    </div>

                </section>
            );
        }


        // ============================================================
        // 문제 5. 즐겨찾기 목록 + 개수를 탭 제목에 반영
        // ============================================================

        function FavoritesList() {

            const [favorites, setFavorites] = useState([
                {
                    id: 1,
                    name: '리액트 공식 문서'
                },
                {
                    id: 2,
                    name: 'MDN'
                }
            ]);

            const [inputValue, setInputValue] = useState('');


            // ----------------------------
            // 추가
            // ----------------------------

            const handleAdd = () => {

                // 빈 문자열이면 추가하지 않는다.
                if (inputValue.trim() === '') {
                    return;
                }

                const newFavorite = {
                    id: Date.now(),
                    name: inputValue
                };

                // 기존 배열을 변경하지 않고 새로운 배열 생성
                setFavorites([
                    ...favorites,
                    newFavorite
                ]);

                // 입력창 초기화
                setInputValue('');

            };


            // ----------------------------
            // 삭제
            // ----------------------------

            const handleRemove = (id) => {

                setFavorites(
                    favorites.filter(
                        fav => fav.id !== id
                    )
                );

            };


            // ----------------------------
            // 즐겨찾기 개수가 바뀔 때
            // document.title 변경
            // ----------------------------

            useEffect(() => {

                document.title = `즐겨찾기 ${favorites.length}개`;

            }, [favorites.length]);


            return (
                <section className="problem">

                    <h2>문제 5. 즐겨찾기 목록 관리</h2>

                    <ul className="requirements">

                        <li>
                            <code>favorites</code> 배열 state와 입력값 state를 관리합니다.
                        </li>

                        <li>
                            입력 후 추가 버튼을 누르면 목록에 새 항목이 생깁니다.
                        </li>

                        <li>
                            빈 값은 무시합니다.
                        </li>

                        <li>
                            각 항목의 삭제 버튼을 누르면 해당 항목만 제거됩니다.
                        </li>

                        <li>
                            목록 개수가 바뀔 때마다 브라우저 탭 제목이
                            "즐겨찾기 3개"처럼 갱신됩니다.
                        </li>

                    </ul>


                    <div className="controls">

                        <input
                            type="text"
                            placeholder="사이트 이름을 입력하세요"
                            value={inputValue}
                            onChange={(e) =>
                                setInputValue(e.target.value)
                            }
                        />

                        <button onClick={handleAdd}>
                            추가
                        </button>

                    </div>


                    <div>

                        {favorites.map((fav) => (

                            <div
                                className="todo-row"
                                key={fav.id}
                            >

                                <span>
                                    {fav.name}
                                </span>

                                <button
                                    className="secondary"
                                    onClick={() =>
                                        handleRemove(fav.id)
                                    }
                                >
                                    삭제
                                </button>

                            </div>

                        ))}

                    </div>

                </section>
            );
        }


        // ============================================================
        // App
        // ============================================================

        function App() {

            return (

                <main className="app">

                    <WelcomeMessage />

                    <TitleUpdater />

                    <StopWatch />

                    <NetworkStatus />

                    <FavoritesList />

                </main>

            );
        }


        ReactDOM
            .createRoot(document.getElementById('root'))
            .render(<App />);

    </script>

</body>

</html>
